
name: Java CI/CD - AWS Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build and test the application
      - name: Build Java application
        run: mvn -B clean verify

      # Step 4: Prepare SSH connection
      - name: Configure SSH
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      # Step 5: Transfer JAR to AWS
      - name: Copy JAR to AWS server
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
        run: |
          scp -i ~/.ssh/deploy_key \
            target/github-actions-demo-1.0-SNAPSHOT.jar \
            "$AWS_USERNAME@$AWS_HOST:/opt/java-app/github-actions-demo-1.0-SNAPSHOT.jar"

      # Step 6: Restart Java application on AWS
      - name: Restart application on AWS
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$AWS_USERNAME@$AWS_HOST" \
            "sudo -n systemctl restart java-app && sudo -n systemctl is-active java-app"
